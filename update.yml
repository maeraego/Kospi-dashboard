name: 대시보드 자동 갱신

# 실행 조건
on:
  schedule:
    # UTC 기준. 09:30 UTC = 한국시간 18:30 (장마감 후)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:          # 👈 깃허브 화면에서 버튼으로 수동 실행 (핸드폰에서도 가능)
    inputs:
      ni_fy1:
        description: '올해 예상순이익(조원) 예: 606 · 비워두면 기존값 유지'
        required: false
        default: ''
      ni_fy2:
        description: '내년 예상순이익(조원) 예: 946 · 비워두면 기존값 유지'
        required: false
        default: ''
      fwd_per:
        description: '(선택) 예상PER 직접 입력 · 순이익을 넣으면 무시됨'
        required: false
        default: ''

permissions:
  contents: write             # parquet/대시보드 커밋용

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 수집 ──────────────────────────────────────────
      # 하나가 실패해도 나머지는 계속 진행 (continue-on-error)
      - name: KRX 수집
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect_krx.py

      - name: ECOS 수집
        continue-on-error: true
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python collect_ecos.py

      - name: FRED 수집
        continue-on-error: true
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: python collect_fred.py

      - name: 수급(투자자별) 수집
        continue-on-error: true
        run: python collect_flow.py

      # ── 예상순이익/예상PER 반영 (입력이 있을 때만) ──────────
      # 순이익 두 칸 중 하나라도 넣으면 12개월 가중평균으로 선행PER 계산.
      - name: 예상순이익 반영
        if: ${{ github.event.inputs.ni_fy1 != '' || github.event.inputs.ni_fy2 != '' }}
        run: |
          python - <<'PY'
          import subprocess, csv, os, sys
          n1 = "${{ github.event.inputs.ni_fy1 }}".strip()
          n2 = "${{ github.event.inputs.ni_fy2 }}".strip()
          p1 = p2 = ""
          if os.path.exists("fwd_ni.csv"):
              rows = list(csv.DictReader(open("fwd_ni.csv", encoding="utf-8")))
              if rows:
                  p1, p2 = rows[-1].get("FY1",""), rows[-1].get("FY2","")
          a1, a2 = (n1 or p1), (n2 or p2)
          if a1 and a2:
              subprocess.run([sys.executable,"update_fwd_per.py","--ni",a1,a2], check=True)
          else:
              print("순이익 값이 부족해 건너뜁니다:", a1, a2)
          PY

      - name: 예상PER 직접 반영
        if: ${{ github.event.inputs.ni_fy1 == '' && github.event.inputs.ni_fy2 == '' && github.event.inputs.fwd_per != '' }}
        run: python update_fwd_per.py "${{ github.event.inputs.fwd_per }}"

      # ── 대시보드 생성 ──────────────────────────────────
      - name: 대시보드 생성
        run: |
          python build_dashboard.py
          mkdir -p docs
          cp dashboard.html docs/index.html

      # ── 결과 저장 (데이터가 다음 실행에 이어짐) ─────────────
      - name: 커밋 & 푸시
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@github.com"
          git add -A *.parquet *.csv docs/index.html dashboard.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: 요약
        run: |
          echo "### 갱신 완료 :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "실행 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "대시보드: https://\${{ github.repository_owner }}.github.io/\${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
