name: 대시보드 생성 (절충안)

# KRX는 해외 서버(GitHub)에서 접속이 막히므로, 데이터 수집은 집 PC가 맡고
# 클라우드는 '대시보드 생성 + 배포'만 한다.
#   집 PC:  수집 → parquet 커밋/푸시
#   클라우드: 푸시 감지 → build_dashboard.py → GitHub Pages 배포
#
# ECOS·FRED는 해외에서도 되는 편이라, 원하면 아래 두 단계의 주석을 풀어
# 그 둘만 클라우드에서 갱신할 수도 있다.

on:
  push:
    paths:                      # parquet이 새로 올라오면 자동 재생성
      - '*.parquet'
      - '*.csv'
      - 'build_dashboard.py'
  workflow_dispatch:            # 손으로도 실행 (순이익 입력 가능)
    inputs:
      ni_fy1:
        description: '올해 예상순이익(조원) 예: 606 · 비워두면 기존값 유지'
        required: false
        default: ''
      ni_fy2:
        description: '내년 예상순이익(조원) 예: 946 · 비워두면 기존값 유지'
        required: false
        default: ''
      fwd_per:
        description: '(선택) 예상PER 직접 입력 · 순이익을 넣으면 무시됨'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: dashboard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow

      # ── (선택) 해외에서도 되는 매크로만 클라우드에서 갱신하고 싶으면 주석 해제 ──
      # - name: ECOS 수집
      #   continue-on-error: true
      #   env: { ECOS_KEY: '${{ secrets.ECOS_KEY }}' }
      #   run: pip install requests python-dotenv && python collect_ecos.py
      # - name: FRED 수집
      #   continue-on-error: true
      #   env: { FRED_KEY: '${{ secrets.FRED_KEY }}' }
      #   run: pip install requests python-dotenv && python collect_fred.py

      - name: 예상순이익 반영
        if: ${{ github.event.inputs.ni_fy1 != '' || github.event.inputs.ni_fy2 != '' }}
        run: |
          python - <<'PY'
          import subprocess, csv, os, sys
          n1 = "${{ github.event.inputs.ni_fy1 }}".strip()
          n2 = "${{ github.event.inputs.ni_fy2 }}".strip()
          p1 = p2 = ""
          if os.path.exists("fwd_ni.csv"):
              rows = list(csv.DictReader(open("fwd_ni.csv", encoding="utf-8")))
              if rows: p1, p2 = rows[-1].get("FY1",""), rows[-1].get("FY2","")
          a1, a2 = (n1 or p1), (n2 or p2)
          if a1 and a2:
              subprocess.run([sys.executable,"update_fwd_per.py","--ni",a1,a2], check=True)
          else:
              print("순이익 값이 부족해 건너뜁니다:", a1, a2)
          PY

      - name: 예상PER 직접 반영
        if: ${{ github.event.inputs.ni_fy1 == '' && github.event.inputs.ni_fy2 == '' && github.event.inputs.fwd_per != '' }}
        run: python update_fwd_per.py "${{ github.event.inputs.fwd_per }}"

      - name: 대시보드 생성
        run: |
          python build_dashboard.py
          mkdir -p docs
          cp dashboard.html docs/index.html

      - name: 커밋 & 푸시
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@github.com"
          git add -A docs/index.html dashboard.html *.parquet *.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "대시보드 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: 요약
        run: |
          echo "### 대시보드 생성 완료 :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "데이터는 집 PC가 올린 parquet 기준입니다." >> $GITHUB_STEP_SUMMARY
          echo "https://\${{ github.repository_owner }}.github.io/\${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
